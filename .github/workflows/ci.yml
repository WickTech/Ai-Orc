name: CI

# This workflow is written per spec but has never run: there is no remote
# configured for this repository (see README "CI note"). Whether it works
# unmodified on GitHub Actions is therefore unverified.

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:data && npm run validate
